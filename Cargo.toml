[workspace]
resolver = "2"
members = [
    "crates/tiletopia-core",
    "crates/tiletopia-server",
    "crates/tiletopia-worker",
    "crates/tiletopia-ingest",
    "crates/tiletopia-terrain",
    "crates/tiletopia-store",
    "crates/tiletopia-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0"
authors = ["tiletopia contributors"]
repository = "https://github.com/tiletopia/tiletopia"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
bytes = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
wgpu = "24"
memmap2 = "0.9"
las = "0.9"
tiff = "0.9"
gltf = "1"
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
async-trait = "0.1"
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Format readers
e57 = "0.11"
ply-rs = "0.1"
geojson = "1"
shapefile = "0.8"
geo-types = "0.7"

# CRS transforms
proj4rs = "0.1"

# Mesh compression
meshopt = "0.6"
bytemuck = { version = "1", features = ["derive"] }
draco-rs = "0.1"

# OBJ loading
tobj = "4"

# FBX loading
fbxcel-dom = "0.0.10"

# IFC geometry
ifc-lite-core = "2.3"
ifc-lite-geometry = "2.3"

# XML parsing (CityGML, KML)
quick-xml = "0.39"

# GeoPackage (SQLite)
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client (federation, webhooks, geocoding)
reqwest = { version = "0.12", features = ["json"] }

# Image generation (static maps)
image = "0.25"

# Encryption
aes-gcm = "0.10"
rand = "0.9"

# HMAC signatures (webhooks)
hmac = "0.12"
sha2 = "0.10"
