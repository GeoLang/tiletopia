[workspace]
resolver = "2"
members = [
    "crates/tiletopia-core",
    "crates/tiletopia-server",
    "crates/tiletopia-worker",
    "crates/tiletopia-ingest",
    "crates/tiletopia-terrain",
    "crates/tiletopia-store",
    "crates/tiletopia-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["tiletopia contributors"]
repository = "https://github.com/tiletopia/tiletopia"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
bytes = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
wgpu = "24"
memmap2 = "0.9"
las = "0.9"
async-trait = "0.1"
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
