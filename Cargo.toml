[workspace]
resolver = "2"
members = [
    "crates/tiletopia-core",
    "crates/tiletopia-server",
    "crates/tiletopia-ingest",
    "crates/tiletopia-terrain",
    "crates/tiletopia-store",
    "crates/tiletopia-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["GeoLang <tiletopia@proton.me>"]
repository = "https://github.com/GeoLang/tiletopia"
description = "Geospatial tile server platform with terrain and point cloud services"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-br", "compression-gzip"] }
bytes = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled"] }
memmap2 = "0.9"
las = "0.9"
tiff = "0.9"
png = "0.18"
gltf = "1"
async-trait = "0.1"
futures = "0.3"
libc = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Format readers
e57 = "0.11"
ply-rs = "0.1"
geo = { version = "0.33", default-features = false }

# CRS transforms
projicio-core = { git = "https://github.com/GeoLang/projicio.git", branch = "master" }

# Mesh compression
meshopt = "0.7"
bytemuck = { version = "1", features = ["derive"] }
draco-gltf = { version = "0.7", default-features = false, features = ["draco-encode"] }

# OBJ loading
tobj = { version = "4", features = ["use_f64"] }

# FBX loading
fbxcel-dom = "0.0.10"

# COLLADA loading
dae-parser = "0.11"
percent-encoding = "2"

# IFC geometry
ifc-lite-core = "28.2"
ifc-lite-geometry = "28.2"

# XML parsing (CityGML, KML)
quick-xml = "0.39"

# HTTP client (webhooks, STAC, COG)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Image generation (static maps)
image = "0.25"

# IFC property and quantity decoding, its version has to match ifc-lite-core
ifc-lite-processing = "28.2"

# KHR_texture_basisu tile textures
basisu_c_sys = { version = "0.9", features = ["encoder", "extra"] }
ktx2 = "0.5"

# Random bytes (api keys, webhook secrets)
rand = "0.9"

# HMAC signatures (webhooks)
hmac = "0.12"
sha2 = "0.10"

# Password hashing (argon2id), matching collecta
argon2 = { version = "0.5", features = ["std"] }

# Cron parsing (scheduler)
cron = "0.15"

# WASM plugin runtime (wasm-plugins feature)
wasmtime = "30"

# Martin tile serving (martin feature — MBTiles, PMTiles, PostGIS tile sources)
martin-core = { version = "0.11", default-features = false, features = ["mbtiles", "pmtiles", "postgres"] }
martin-tile-utils = "0.7"
tilejson = "0.4"
# must be the object_store martin-core hands to pmtiles, or PmtilesSource::new rejects our store
object_store = { version = "0.14", features = ["fs"] }

# JPEG 2000 uploads (jp2 feature). The rev matches GROK_REV in the Dockerfile and ci.yml
grokj2k-sys = { git = "https://github.com/GrokImageCompression/grok.git", rev = "00f9baaed2f41a8dadef1c62cf009d8e80064e9d" }

# GeoLang ecosystem crates
nubis-core = { git = "https://github.com/GeoLang/nubis.git", tag = "v0.1.0" }
terrano-core = { git = "https://github.com/GeoLang/terrano.git", branch = "master" }
geoplumb = { git = "https://github.com/GeoLang/geoplumb.git", branch = "master" }
topoi-core = { git = "https://github.com/GeoLang/topoi.git", branch = "master" }
platform-auth = { git = "https://github.com/GeoLang/platform-crates.git", branch = "master" }
platform-webhook = { git = "https://github.com/GeoLang/platform-crates.git", branch = "master" }

