[workspace]
resolver = "2"
members = [
    "crates/tiletopia-core",
    "crates/tiletopia-server",
    "crates/tiletopia-ingest",
    "crates/tiletopia-terrain",
    "crates/tiletopia-store",
    "crates/tiletopia-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["GeoLang <tiletopia@proton.me>"]
repository = "https://github.com/GeoLang/tiletopia"
description = "Geospatial tile server platform with routing, terrain, and point cloud services"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
bytes = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
wgpu = "24"
memmap2 = "0.9"
las = "0.9"
tiff = "0.9"
gltf = "1"
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
async-trait = "0.1"
cloud-storage = { version = "0.11", default-features = false, features = ["rustls-tls"] }
azure_storage = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
azure_storage_blobs = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
futures = "0.3"
libc = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Format readers
e57 = "0.11"
ply-rs = "0.1"
geo = { version = "0.33", default-features = false }
geo-types = "0.7"

# CRS transforms
projicio-core = { git = "https://github.com/GeoLang/projicio.git", branch = "master" }

# Mesh compression
meshopt = "0.6"
bytemuck = { version = "1", features = ["derive"] }
draco-rs = "0.1"

# OBJ loading
tobj = "4"

# FBX loading
fbxcel-dom = "0.0.10"

# IFC geometry
ifc-lite-core = "2.3"
ifc-lite-geometry = "2.3"

# XML parsing (CityGML, KML)
quick-xml = "0.39"

# HTTP client (webhooks, geocoding)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Image generation (static maps)
image = "0.25"

# Random bytes (api keys, webhook secrets)
rand = "0.9"

# HMAC signatures (webhooks)
hmac = "0.12"
sha2 = "0.10"

# Password hashing (argon2id), matching collecta
argon2 = { version = "0.5", features = ["std"] }

# Graph algorithms (indoor routing)
petgraph = "0.7"

# Cron parsing (scheduler)
cron = "0.15"

# WASM plugin runtime (wasm-plugins feature)
wasmtime = "30"

# Martin tile serving (martin feature — MBTiles, PMTiles, PostGIS tile sources)
martin-core = { version = "0.5", default-features = false, features = ["mbtiles", "pmtiles", "postgres"] }
martin-tile-utils = "0.7"
tilejson = "0.4"
object_store = { version = "0.13", features = ["fs"] }

# GeoLang ecosystem crates
itinera-core = { git = "https://github.com/GeoLang/itinera.git" }
itinera-graph = { git = "https://github.com/GeoLang/itinera.git" }
itinera-match = { git = "https://github.com/GeoLang/itinera.git" }
geokode-core = { git = "https://github.com/GeoLang/geokode.git", tag = "v0.1.0" }
nubis-core = { git = "https://github.com/GeoLang/nubis.git", tag = "v0.1.0" }
terrano-core = { git = "https://github.com/GeoLang/terrano.git", branch = "master" }
geoplumb = { git = "https://github.com/GeoLang/geoplumb.git", branch = "master" }

[patch.crates-io]
draco-rs = { path = "patches/draco-rs" }
