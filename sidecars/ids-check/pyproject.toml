[project]
name = "ids-check"
version = "0.1.0"
description = "Checks an IFC file against an IDS file with ifctester, over HTTP"
requires-python = "==3.13.*"
dependencies = [
    "ifcopenshell==0.9.0.post1",
    "ifctester==0.9.0",
    "xmlschema==4.3.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
