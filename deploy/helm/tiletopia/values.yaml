replicaCount: 1

image:
  repository: tiletopia
  pullPolicy: IfNotPresent
  tag: "latest"

# required: the http or https origin clients reach this server at, with no path or trailing slash
ionBaseUrl: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tiletopia.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

env:
  RUST_LOG: "info,tiletopia=debug"

nodeSelector: {}
tolerations: []
affinity: {}
