[package]
name = "tiletopia-cache"
description = "Tile caching layer — Redis, Memcached, and in-memory LRU cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["redis"]
redis = ["dep:redis"]
memcached = ["dep:memcache"]

[dependencies]
tiletopia-core = { path = "../tiletopia-core", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
memcache = { version = "0.17", optional = true }
lru = "0.13"
