[package]
name = "tiletopia-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API server — tile streaming, asset management, WebSocket real-time layer"

[dependencies]
tiletopia-core = { path = "../tiletopia-core", default-features = false }
tiletopia-terrain = { path = "../tiletopia-terrain" }
tiletopia-worker = { path = "../tiletopia-worker" }
tiletopia-store = { path = "../tiletopia-store" }
tiletopia-ingest = { path = "../tiletopia-ingest" }
itinera-core = { workspace = true }
itinera-graph = { workspace = true }
itinera-match = { workspace = true }
geo = { workspace = true }
geokode-core = { workspace = true }
nubis-core = { workspace = true }
terrano-core = { workspace = true }
geoplumb = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
bytes = { workspace = true }
# the COG reader is synchronous, so its range requests go through the blocking
# client on a blocking thread
reqwest = { workspace = true, features = ["blocking"] }
image = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
geo-types = { workspace = true }
tiff = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
sqlx = { workspace = true }
gltf = { workspace = true }
petgraph = { workspace = true }
cron = { workspace = true }
printpdf = { workspace = true }
las = { workspace = true, features = ["laz"] }
zip = { version = "8", default-features = false }
wasmtime = { workspace = true, optional = true }
video-rs = { workspace = true, optional = true }
martin-core = { workspace = true, optional = true }
martin-tile-utils = { workspace = true, optional = true }
tilejson = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }

# the tileset builder caps what tippecanoe may map and write, between fork
# and exec
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
wasm-plugins = ["wasmtime"]
video = ["video-rs"]
martin = ["martin-core", "martin-tile-utils", "tilejson", "object_store"]

[dev-dependencies]
terrano-core = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures = { workspace = true }
tempfile = "3"
flate2 = "1"
# martin-core enables pmtiles with tilejson and object-store only, so the
# writer that builds the test fixtures is not reachable without this
pmtiles = { version = "0.23", default-features = false, features = ["write"] }
tiletopia-store = { path = "../tiletopia-store" }
quick-xml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
