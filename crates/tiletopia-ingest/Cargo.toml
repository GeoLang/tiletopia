[package]
name = "tiletopia-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Format readers: LAS/LAZ, E57, PLY, GeoTIFF, DTED, HGT, USGS DEM, glTF, OBJ, FBX, CityGML, CityJSON, IFC"

[dependencies]
tiletopia-core = { path = "../tiletopia-core", default-features = false }
nubis-core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
las = { workspace = true }
tiff = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }
e57 = { workspace = true }
ply-rs = { workspace = true }
tobj = { workspace = true }
quick-xml = { workspace = true }
fbxcel-dom = { workspace = true }
ifc-lite-core = { workspace = true }
ifc-lite-geometry = { workspace = true }

[dev-dependencies]
tempfile = "3"
# writes the small FBX documents the fbx_reader tests read back
fbxcel = { version = "0.9", features = ["tree", "writer"] }
