<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TileTopia Dashboard</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>🌍 TileTopia</h1>
    <nav>
      <button class="nav-btn active" data-view="viewer">3D Viewer</button>
      <button class="nav-btn" data-view="catalog">📦 Data Catalog</button>
      <button class="nav-btn" data-view="assets">Assets</button>
      <button class="nav-btn" data-view="jobs">Jobs</button>
      <button class="nav-btn" data-view="measure">📏 Measurement</button>
      <button class="nav-btn" data-view="anomaly">⚠️ Anomaly Detection</button>
      <button class="nav-btn" data-view="clash">💥 Clash Analytics</button>
      <button class="nav-btn" data-view="admin">🔒 Enterprise Admin</button>
      <button class="nav-btn" data-view="stories">🎬 Stories</button>
      <button class="nav-btn" data-view="terrain">⛰️ Terrain</button>
      <button class="nav-btn" data-view="entities">🔗 Entity Links</button>
    </nav>
    <div id="asset-list"></div>
    <div id="upload-section">
      <h3>Upload</h3>
      <input type="file" id="file-input" accept=".las,.laz,.tif,.tiff,.gltf,.glb">
      <button id="upload-btn">Upload & Tile</button>
    </div>
    <div id="server-status">
      <span class="status-dot"></span>
      <span id="status-text">No server</span>
    </div>
  </aside>
  <div id="chat-panel">
    <div id="chat-header">
      <span>🤖 GeoLang Agent</span>
      <button id="chat-toggle" title="Toggle chat">◀</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <textarea id="chat-input" placeholder="Ask the agent to analyze data, fly to locations, show layers..." rows="2"></textarea>
      <button id="chat-send">Send</button>
    </div>
    <div id="chat-status">
      <span id="agent-status">Ready</span>
    </div>
  </div>
  <main id="main-content">
    <div id="cesium-container" class="panel active"></div>
    <div id="panel-catalog" class="panel"></div>
    <div id="panel-measure" class="panel"></div>
    <div id="panel-anomaly" class="panel"></div>
    <div id="panel-clash" class="panel"></div>
    <div id="panel-admin" class="panel"></div>
    <div id="panel-stories" class="panel"></div>
    <div id="panel-terrain" class="panel"></div>
    <div id="panel-entities" class="panel"></div>
    <div id="renderer-selector">
      <label>Renderer:</label>
      <select id="renderer-choice">
        <option value="cesium" selected>CesiumJS</option>
        <option value="deckgl">deck.gl</option>
        <option value="maplibre">MapLibre GL</option>
      </select>
    </div>
    <div id="viewer-toolbar">
      <button class="toolbar-btn" id="tb-distance" title="Measure Distance">📏</button>
      <button class="toolbar-btn" id="tb-area" title="Measure Area">📐</button>
      <button class="toolbar-btn" id="tb-height" title="Measure Height">⬆️</button>
      <button class="toolbar-btn" id="tb-annotate" title="Add Annotation">📍</button>
      <button class="toolbar-btn" id="tb-style" title="Style Editor">🎨</button>
      <button class="toolbar-btn" id="tb-featureinfo" title="Feature Info">ℹ️</button>
      <button class="toolbar-btn" id="tb-clear" title="Clear Measurements">🗑️</button>
      <button class="toolbar-btn" id="tb-timeslider" title="Time Slider">⏱️</button>
      <button class="toolbar-btn" id="tb-osm" title="Load OSM Buildings">🏢</button>
      <button class="toolbar-btn" id="tb-classify" title="Classification Colors">🎯</button>
      <span id="measure-status" class="toolbar-status"></span>
    </div>
    <div id="time-slider-container" style="display:none">
      <label>Time: <input type="range" id="time-slider" min="0" max="100" value="100"></label>
      <span id="time-label">Latest</span>
    </div>
  </main>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
