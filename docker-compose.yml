# Local development with Docker Compose
# Usage: docker compose up
version: "3.9"

services:
  tiletopia:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - tile-data:/data
    environment:
      - RUST_LOG=info,tiletopia=debug
      - TILETOPIA_PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: local S3-compatible storage (MinIO)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: tiletopia
      MINIO_ROOT_PASSWORD: tiletopia-dev
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  tile-data:
  minio-data:
