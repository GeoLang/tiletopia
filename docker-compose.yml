# Local development with Docker Compose
# Usage: docker compose up
version: "3.9"

services:
  tiletopia:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - tile-data:/data
    environment:
      - RUST_LOG=info,tiletopia=debug
      - TILETOPIA_PORT=3000
      # local dev only: a known secret is no better than none in production.
      # 32-byte minimum, or the server refuses to start.
      - TILETOPIA_JWT_SECRET=${TILETOPIA_JWT_SECRET:-local-dev-secret-not-for-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  tile-data:
