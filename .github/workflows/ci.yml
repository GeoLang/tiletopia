name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --no-default-features
        if: runner.os == 'Windows'

      - name: Build (with cloud backends)
        run: cargo build --release --features tiletopia-core/draco,tiletopia-store/gcs,tiletopia-store/azure
        if: runner.os != 'Windows'

      - name: Test
        run: cargo test --release --no-default-features
        if: runner.os == 'Windows'

      - name: Test (with cloud backends)
        run: cargo test --release --features tiletopia-core/draco,tiletopia-store/gcs,tiletopia-store/azure
        if: runner.os != 'Windows'

      - name: Clippy
        run: cargo clippy --no-default-features -- -D warnings
        if: runner.os == 'Windows'

      - name: Clippy (with cloud backends)
        run: cargo clippy --features tiletopia-core/draco,tiletopia-store/gcs,tiletopia-store/azure -- -D warnings
        if: runner.os != 'Windows'

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
