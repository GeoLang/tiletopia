name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  MAGO_VERSION: 1.16.2
  MAGO_SHA256: d37e58b634e91d7ce7ca046168b1db2cf950cd9b2ffacb826fd3b10a8d31f7e2
  TIPPECANOE_VERSION: 2.79.0

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            features: draco,gpu,plugin-dylib,ml,martin
          - os: macos-latest
            features: draco,gpu,plugin-dylib,ml,martin
          - os: windows-latest
            features: gpu,plugin-dylib,ml,martin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      # the mago jar ships linux/x64 and windows/x64 natives only, so the
      # external tiler test skips itself on macos
      - uses: actions/setup-java@v4
        if: runner.os != 'macOS'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        if: runner.os != 'macOS'
        with:
          path: ${{ runner.temp }}/mago-3d-tiler.jar
          key: mago-${{ env.MAGO_VERSION }}
      - name: Download mago-3d-tiler
        if: runner.os != 'macOS'
        shell: bash
        run: |
          jar="$RUNNER_TEMP/mago-3d-tiler.jar"
          if [ ! -f "$jar" ]; then
            curl -fsSL -o "$jar" \
              "https://github.com/Gaia3D/mago-3d-tiler/releases/download/v$MAGO_VERSION/mago-3d-tiler-$MAGO_VERSION.jar"
          fi
          echo "$MAGO_SHA256  $jar" | sha256sum -c -
          echo "TILETOPIA_MAGO_JAR=$jar" >> "$GITHUB_ENV"
      # the tileset tests skip themselves without this binary, so only the row
      # that installs it builds a real archive
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/tippecanoe/bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}
      - name: Install tippecanoe
        if: runner.os == 'Linux'
        run: |
          prefix="$RUNNER_TEMP/tippecanoe"
          if [ ! -x "$prefix/bin/tippecanoe" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
            git clone --depth 1 -b "$TIPPECANOE_VERSION" \
              https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe-src"
            make -C "$RUNNER_TEMP/tippecanoe-src" -j"$(nproc)"
            make -C "$RUNNER_TEMP/tippecanoe-src" install PREFIX="$prefix"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test --all --no-default-features --features ${{ matrix.features }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --show-stats
        continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --features draco,gpu,plugin-dylib,ml --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tiletopia:ci .

